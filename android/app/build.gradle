apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def packageMetadata = new JsonSlurper().parse(file('../../package.json'))
def resolvedVersionName = System.getenv('APP_VERSION_NAME')?.trim() ?: packageMetadata.version
def versionMatch = resolvedVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionMatch.matches()) {
    throw new GradleException('APP_VERSION_NAME must use numeric semantic versioning: X.Y.Z')
}
if (versionMatch[0][2].toInteger() > 99 || versionMatch[0][3].toInteger() > 99) {
    throw new GradleException('APP_VERSION_NAME minor and patch components must not exceed 99')
}
def calculatedVersionCode =
        versionMatch[0][1].toInteger() * 1_000_000 +
        versionMatch[0][2].toInteger() * 10_000 +
        versionMatch[0][3].toInteger() * 100
def resolvedVersionCode = System.getenv('APP_VERSION_CODE')?.trim()
        ? System.getenv('APP_VERSION_CODE').toInteger()
        : calculatedVersionCode

// Upload-key signing lives outside the repository. Point KEYSTORE_PROPERTIES_FILE
// (or the default path below) at a properties file with storeFile, storePassword,
// keyAlias and keyPassword. Without it, release builds stay unsigned.
def keystorePropertiesFile = file(System.getenv('KEYSTORE_PROPERTIES_FILE')
        ?: "${System.properties['user.home']}/AndroidKeys/piramide-bird-upload.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
if (releaseTaskRequested && (!keystorePropertiesFile.exists() || !missingSigningProperties.isEmpty())) {
    throw new GradleException(
        "A release build requires a complete external signing properties file. " +
        "Set KEYSTORE_PROPERTIES_FILE or create ${keystorePropertiesFile}."
    )
}
if (!keystoreProperties.isEmpty() && !file(keystoreProperties['storeFile']).isFile()) {
    throw new GradleException('The configured Android upload keystore does not exist.')
}

android {
    namespace = "com.breixopd.piramidebird"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.breixopd.piramidebird"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (!keystoreProperties.isEmpty()) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!keystoreProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.lifecycle('google-services.json not found: Firebase build plugins are disabled.')
}
